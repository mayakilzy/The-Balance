# The Balance — local development environment
# Usage: docker compose up -d postgres
# Stop:  docker compose down
# Reset: docker compose down -v  (WARNING: deletes data)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: balance-postgres
    environment:
      POSTGRES_USER: balance
      POSTGRES_PASSWORD: balance
      POSTGRES_DB: balance
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - balance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balance -d balance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  balance_pgdata:
    driver: local
