name: CI

on:
  push:
    branches: [main, g00/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test + Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: balance
          POSTGRES_PASSWORD: balance
          POSTGRES_DB: balance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://balance:balance@localhost:5432/balance?schema=public"
      DIRECT_URL: "postgresql://balance:balance@localhost:5432/balance?schema=public"
      AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
      AUTH_TRUST_HOST: "true"
      LLM_PROVIDER: "stub"
      LOG_LEVEL: "warn"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U balance > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Run migrations
        # NO `|| echo` — migration failure MUST fail CI.
        run: bunx prisma migrate deploy

      - name: Verify DB connection + schema applied
        run: |
          # Smoke-test: confirm the schema is actually applied.
          # Use psql directly (available on ubuntu-latest runners) for clarity.
          # --url alone is what prisma db execute accepts; we drop --schema.
          cat > /tmp/verify.sql <<'SQL'
          -- Tables exist?
          SELECT 'tenants' AS table_name, count(*) AS row_count FROM tenants
          UNION ALL
          SELECT 'audit_log', count(*) FROM audit_log;
          -- pgvector extension installed?
          SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';
          SQL
          # prisma db execute with --url only (not --schema).
          bunx prisma db execute --url "$DATABASE_URL" --file /tmp/verify.sql

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + integration)
        run: bun run test
        env:
          # Integration tests read this to know they can connect.
          RUN_INTEGRATION_TESTS: "1"

      - name: Build (production)
        run: bun run build
        env:
          # Build-time env: Next.js reads some vars at build time.
          DATABASE_URL: "postgresql://balance:balance@localhost:5432/balance?schema=public"
          AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
          LLM_PROVIDER: "stub"
