name: CI

on:
  push:
    branches: [main, g00/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test + Integration (RLS + Append-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: balance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # balance_app role — RLS-enforced — used by app + tests
      DATABASE_URL: "postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
      # balance_admin role — BYPASSRLS — used by migrations + seed only
      DIRECT_URL: "postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
      AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
      AUTH_TRUST_HOST: "true"
      LLM_PROVIDER: "stub"
      LOG_LEVEL: "warn"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Setup database roles + extensions (as postgres superuser)
        # Uses scripts/run-setup-roles.sh which calls setup-roles.sql.
        # CI uses dev-default passwords (env vars not set).
        # Production MUST set PGPASSWORD_BALANCE_ADMIN + PGPASSWORD_BALANCE_APP.
        env:
          PGPASSWORD: postgres
        run: |
          # Run the canonical setup script (dev defaults in CI)
          bash scripts/run-setup-roles.sh

          # CI-ONLY: grant SUPERUSER to balance_admin for CREATE EXTENSION.
          # In production, balance_admin is NOSUPERUSER and extensions are pre-installed.
          psql -h localhost -U postgres -d balance -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE balance_admin WITH SUPERUSER;
          SQL

      - name: Run migrations (as balance_admin via DIRECT_URL)
        # NO `|| echo` — migration failure MUST fail CI.
        env:
          PGPASSWORD: balance_admin_dev_only
        run: bunx prisma migrate deploy

      - name: Seed ontology (as balance_admin via DIRECT_URL)
        run: bun run db:seed

      - name: Verify role privileges (security check)
        # Asserts balance_app has NO SUPERUSER, NO BYPASSRLS, NO CREATE on schema,
        # and NO UPDATE/DELETE on audit_log (append-only).
        env:
          PGPASSWORD: postgres
        run: |
          # Run all checks; fail if ANY returns 'FAIL'.
          RESULT=$(psql -h localhost -U postgres -d balance -v ON_ERROR_STOP=1 -t -A <<'SQL'
          SELECT CASE WHEN rolsuper THEN 'FAIL: balance_app is SUPERUSER' ELSE 'OK: balance_app not superuser' END FROM pg_roles WHERE rolname = 'balance_app'
          UNION ALL
          SELECT CASE WHEN rolbypassrls THEN 'FAIL: balance_app has BYPASSRLS' ELSE 'OK: balance_app no BYPASSRLS' END FROM pg_roles WHERE rolname = 'balance_app'
          UNION ALL
          SELECT CASE WHEN has_schema_privilege('balance_app', 'public', 'CREATE') THEN 'FAIL: balance_app has CREATE on public' ELSE 'OK: balance_app no CREATE on public' END
          UNION ALL
          SELECT CASE WHEN has_table_privilege('balance_app', 'audit_log', 'UPDATE') THEN 'FAIL: balance_app has UPDATE on audit_log' ELSE 'OK: balance_app no UPDATE on audit_log' END
          UNION ALL
          SELECT CASE WHEN has_table_privilege('balance_app', 'audit_log', 'DELETE') THEN 'FAIL: balance_app has DELETE on audit_log' ELSE 'OK: balance_app no DELETE on audit_log' END;
          SQL
          )

          echo "$RESULT"

          if echo "$RESULT" | grep -q "^FAIL:"; then
            echo "ERROR: privilege check failed"
            exit 1
          fi
          echo "All privilege checks passed."

      - name: Verify DB connection + schema + RLS (as balance_app)
        env:
          PGPASSWORD: balance_app_dev_only
        run: |
          psql -h localhost -U balance_app -d balance -v ON_ERROR_STOP=1 <<'SQL'
          -- PUBLIC tables readable?
          SELECT count(*) AS countries_count FROM countries;
          SELECT count(*) AS public_knowledge_count FROM public_knowledge;
          SELECT count(*) AS role_refs_count FROM role_references;

          -- PRIVATE table (audit_log) — fail-closed with no tenant context?
          SELECT count(*) AS audit_log_count_no_tenant FROM audit_log;

          -- pgvector extension installed?
          SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';

          -- audit_log policies: should have SELECT + INSERT only (no UPDATE/DELETE)
          SELECT policyname, cmd FROM pg_policies
          WHERE tablename = 'audit_log' AND 'balance_app' = ANY(roles);
          SQL

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + integration with RLS + append-only on real PG)
        run: bun run test
        env:
          RUN_INTEGRATION_TESTS: "1"

      - name: Build (production)
        run: bun run build
        env:
          DATABASE_URL: "postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
          LLM_PROVIDER: "stub"
