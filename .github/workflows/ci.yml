name: CI

on:
  push:
    branches: [main, g00/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint + Typecheck + Test + Integration (RLS + Append-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: balance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # balance_app role — RLS-enforced — used by app + tests
      DATABASE_URL: "postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
      # balance_admin role — BYPASSRLS — used by migrations + seed only
      DIRECT_URL: "postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
      # balance_auth role — read-only, RLS-exempt for auth bootstrap
      AUTH_DATABASE_URL: "postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public"
      # G03-06 Trust Boundary Closure: privileged role for snapshot approval
      PRIVILEGED_DATABASE_URL: "postgresql://balance_snapshot_approver:balance_snapshot_approver_dev_only@localhost:5432/balance?schema=public"
      AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
      AUTH_TRUST_HOST: "true"
      LLM_PROVIDER: "stub"
      LOG_LEVEL: "warn"
      NODE_ENV: "test"
      # Enable E2E HTTP tests (starts real Next.js server)
      RUN_E2E_HTTP_TESTS: "1"
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Setup database roles + extensions (as postgres superuser)
        # Uses scripts/run-setup-roles.sh which calls setup-roles.sql.
        # CI uses dev-default passwords (env vars not set).
        # Production MUST set PGPASSWORD_BALANCE_ADMIN + PGPASSWORD_BALANCE_APP.
        env:
          PGPASSWORD: postgres
        run: |
          # Run the canonical setup script (dev defaults in CI)
          bash scripts/run-setup-roles.sh

          # CI-ONLY: grant SUPERUSER to balance_admin for CREATE EXTENSION.
          # In production, balance_admin is NOSUPERUSER and extensions are pre-installed.
          psql -h localhost -U postgres -d balance -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE balance_admin WITH SUPERUSER;
          SQL

      - name: Run migrations (as balance_admin via DIRECT_URL)
        # NO `|| echo` — migration failure MUST fail CI.
        env:
          PGPASSWORD: balance_admin_dev_only
        run: bunx prisma migrate deploy

      - name: Seed ontology (as balance_admin via DIRECT_URL)
        run: bun run db:seed

      - name: Verify role privileges (security check)
        # Asserts balance_app has NO SUPERUSER, NO BYPASSRLS, NO CREATE on schema,
        # and NO UPDATE/DELETE on audit_log (append-only).
        env:
          PGPASSWORD: postgres
        run: |
          # Run all checks; fail if ANY returns 'FAIL'.
          RESULT=$(psql -h localhost -U postgres -d balance -v ON_ERROR_STOP=1 -t -A <<'SQL'
          SELECT CASE WHEN rolsuper THEN 'FAIL: balance_app is SUPERUSER' ELSE 'OK: balance_app not superuser' END FROM pg_roles WHERE rolname = 'balance_app'
          UNION ALL
          SELECT CASE WHEN rolbypassrls THEN 'FAIL: balance_app has BYPASSRLS' ELSE 'OK: balance_app no BYPASSRLS' END FROM pg_roles WHERE rolname = 'balance_app'
          UNION ALL
          SELECT CASE WHEN has_schema_privilege('balance_app', 'public', 'CREATE') THEN 'FAIL: balance_app has CREATE on public' ELSE 'OK: balance_app no CREATE on public' END
          UNION ALL
          SELECT CASE WHEN has_table_privilege('balance_app', 'audit_log', 'UPDATE') THEN 'FAIL: balance_app has UPDATE on audit_log' ELSE 'OK: balance_app no UPDATE on audit_log' END
          UNION ALL
          SELECT CASE WHEN has_table_privilege('balance_app', 'audit_log', 'DELETE') THEN 'FAIL: balance_app has DELETE on audit_log' ELSE 'OK: balance_app no DELETE on audit_log' END;
          SQL
          )

          echo "$RESULT"

          if echo "$RESULT" | grep -q "^FAIL:"; then
            echo "ERROR: privilege check failed"
            exit 1
          fi
          echo "All privilege checks passed."

      - name: Verify DB connection + schema + RLS (as balance_app)
        env:
          PGPASSWORD: balance_app_dev_only
        run: |
          psql -h localhost -U balance_app -d balance -v ON_ERROR_STOP=1 <<'SQL'
          -- PUBLIC tables readable?
          SELECT count(*) AS countries_count FROM countries;
          SELECT count(*) AS public_knowledge_count FROM public_knowledge;
          SELECT count(*) AS role_refs_count FROM role_references;

          -- PRIVATE table (audit_log) — fail-closed with no tenant context?
          SELECT count(*) AS audit_log_count_no_tenant FROM audit_log;

          -- pgvector extension installed?
          SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';

          -- audit_log policies: should have SELECT + INSERT only (no UPDATE/DELETE)
          SELECT policyname, cmd FROM pg_policies
          WHERE tablename = 'audit_log' AND 'balance_app' = ANY(roles);
          SQL

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (unit + integration with RLS + append-only on real PG)
        run: bun run test
        env:
          RUN_INTEGRATION_TESTS: "1"
          SKIP_E2E_SERVER: "1"

      - name: G03-01 SQL acceptance suite (real PG, real migration chain)
        # Reviewer directive C/D: reproducible database-backed test command.
        # Runs the G03-01 acceptance suite (25 tests) against the real PostgreSQL 16
        # service, after migrations + seed have completed. Verifies:
        #   - RLS enabled + forced on all 12 G03 tables
        #   - SA-03 split into 6 independent sub-tests (approvedBy/approvedAt/
        #     status→approved/ownerTenantId/coordinationId/content) — each
        #     verifies denial + persisted-data unchanged
        #   - Append-only enforcement (DELETE + UPDATE blocked, row persists)
        #   - FUNCTION privileges (DEFINER DORMANT via EFFECTIVE call;
        #     INVOKER EFFECTIVE call succeeds)
        #   - Migration finished_at IS NOT NULL (not just name present)
        #   - Seed idempotency fixtures present
        # Fails with nonzero exit on any incorrect behavior (ON_ERROR_STOP=1).
        # if: always() — runs even when the test step fails, so security
        # regression is always verified regardless of integration test outcomes.
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d balance -v ON_ERROR_STOP=1 \
            -f scripts/g03-security-validation/g03_01_final_acceptance_rev2.sql

      - name: Build (production)
        if: always()
        run: bun run build
        env:
          DATABASE_URL: "postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
          LLM_PROVIDER: "stub"

      - name: Install Playwright browsers
        if: always()
        run: bunx playwright install --with-deps chromium

      - name: Start Next.js server for Playwright
        if: always()
        run: |
          # Create .env file for the dev server to read
          cat > .env <<ENV
          NODE_ENV=development
          DATABASE_URL="postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          DIRECT_URL="postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
          AUTH_DATABASE_URL="postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET="ci_only_secret_not_for_production_min_16_chars"
          AUTH_TRUST_HOST="true"
          LLM_PROVIDER="stub"
          LOG_LEVEL="warn"
          ENV
          
          # Start dev server on port 3001
          bunx next dev -p 3001 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Wait for server to be ready
          READY=0
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/meta 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server ready after ${i} attempts"
              READY=1
              break
            fi
            echo "Waiting... (attempt $i, HTTP $HTTP_CODE)"
            sleep 2
          done
          
          if [ "$READY" = "0" ]; then
            echo "ERROR: Server did not start within 120 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          
          # Run Playwright tests
          bunx playwright test --reporter=list 2>&1
          PLAYWRIGHT_EXIT=$?
          
          # Kill server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          exit $PLAYWRIGHT_EXIT
        env:
          DATABASE_URL: "postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          DIRECT_URL: "postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
          AUTH_DATABASE_URL: "postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET: "ci_only_secret_not_for_production_min_16_chars"
          AUTH_TRUST_HOST: "true"
          LLM_PROVIDER: "stub"
          NODE_ENV: "development"
          SHOW_DEMO_CREDENTIALS: "true"

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: test-results/screenshots/
          retention-days: 7

      - name: Re-seed ontology (restore evidence deleted by integration tests)
        # Integration tests (especially evidence.integration.test.ts) delete ALL evidence
        # in their beforeAll/afterAll. Re-seed to restore the evidence fabric for E2E tests.
        # The seed is idempotent (uses upserts).
        if: always()
        run: bun run db:seed

      - name: Seed G03-06 HTTP acceptance test users
        # Adds adminb@demolandia.test, reviewera@demolandia.test, observera@demolandia.test
        # for G03-06 HTTP acceptance tests (tests/e2e/g03-06-coordination-http.e2e.test.ts).
        # Idempotent — uses upserts by email.
        if: always()
        run: bunx tsx scripts/seed-http-acceptance.ts
        env:
          DIRECT_URL: "postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"

      - name: G03-02 Reform HTTP E2E tests (real server + real PG)
        # Runs the 13 authenticated HTTP E2E tests for the G03-02 reform vertical
        # slice. These tests start a real Next.js dev server, make authenticated
        # HTTP requests with cookie persistence, and verify the full reform
        # lifecycle: Alert → Proposal → Submit → Approve → Action → Updates →
        # Complete → Verify (F6) → Feedback → Observation → Alert Closure.
        # This step is separate from the vitest test step (which skips E2E
        # via SKIP_E2E_SERVER=1) and from Playwright (which only runs
        # tests/browser/ specs).
        if: always()
        run: |
          # Ensure .env exists (created by the Playwright step above; recreate if skipped)
          cat > .env <<ENV
          NODE_ENV=development
          DATABASE_URL="postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          DIRECT_URL="postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
          AUTH_DATABASE_URL="postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public"
          PRIVILEGED_DATABASE_URL="postgresql://balance_snapshot_approver:balance_snapshot_approver_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET="ci_only_secret_not_for_production_min_16_chars"
          AUTH_TRUST_HOST="true"
          LLM_PROVIDER="stub"
          LOG_LEVEL="warn"
          ENV

          # Start dev server on port 3001
          bunx next dev -p 3001 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to be ready
          READY=0
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/meta 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server ready after ${i} attempts"
              READY=1
              break
            fi
            echo "Waiting... (attempt $i, HTTP $HTTP_CODE)"
            sleep 2
          done

          if [ "$READY" = "0" ]; then
            echo "ERROR: Server did not start within 120 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Run the G03-02 reform HTTP E2E tests via vitest
          # RUN_E2E_HTTP_TESTS=1 enables the tests
          # No SKIP_E2E_SERVER — tests need the running server
          DATABASE_URL="postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public" \
          DIRECT_URL="postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public" \
          AUTH_DATABASE_URL="postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public" \
          PRIVILEGED_DATABASE_URL="postgresql://balance_snapshot_approver:balance_snapshot_approver_dev_only@localhost:5432/balance?schema=public" \
          AUTH_SECRET="ci_only_secret_not_for_production_min_16_chars" \
          AUTH_TRUST_HOST="true" \
          LLM_PROVIDER="stub" \
          RUN_E2E_HTTP_TESTS=1 \
          bunx vitest run tests/e2e/g03-02-reform-e2e.test.ts tests/e2e/g03-06-coordination-http.e2e.test.ts tests/e2e/g01-state-builder-http.e2e.test.ts --reporter=verbose
          E2E_EXIT=$?

          # Kill server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          exit $E2E_EXIT

      - name: G02 State Observatory HTTP E2E tests (isolated server for fresh rate-limit state)
        # Owner directive (Delivery 02 final CI integration): run the 19 G02
        # HTTP e2e tests against a REAL Next.js + PostgreSQL, isolated from
        # the G01/G03 e2e step so the 10/min signin rate limit (per-process
        # in-memory counter) resets between suites.
        #
        # Why a separate step (not appended to the existing e2e command):
        #   The existing e2e step runs g01 + g03-02 + g03-06 against a single
        #   server. Adding g02 to that vitest command pushed the cumulative
        #   signin count past 10/min and broke g03-06 (HTTP 429 in beforeAll).
        #   This separate step starts a FRESH server process after the
        #   previous one is killed, so the rate-limit counter is reset to 0
        #   for the G02 suite. The 10/min limit is preserved (not weakened).
        if: always()
        run: |
          # Ensure no leftover Next.js server from the previous e2e step
          # (defensive — the previous step should have killed it, but if
          # it crashed mid-run, the port might still be occupied).
          pkill -f "next dev" 2>/dev/null || true
          sleep 2

          # Ensure .env exists (created by the previous Playwright/e2e step;
          # recreated here in case that step was skipped due to early failure)
          cat > .env <<ENV
          NODE_ENV=development
          DATABASE_URL="postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public"
          DIRECT_URL="postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public"
          AUTH_DATABASE_URL="postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public"
          PRIVILEGED_DATABASE_URL="postgresql://balance_snapshot_approver:balance_snapshot_approver_dev_only@localhost:5432/balance?schema=public"
          AUTH_SECRET="ci_only_secret_not_for_production_min_16_chars"
          AUTH_TRUST_HOST="true"
          LLM_PROVIDER="stub"
          LOG_LEVEL="warn"
          ENV

          # Start a FRESH Next.js dev server on port 3001.
          # Fresh process = fresh in-memory rate-limit counter (preserves
          # the production 10/min signin limit — it is NOT weakened, just
          # scoped to a new process so the G02 suite starts from 0).
          bunx next dev -p 3001 &
          SERVER_PID=$!
          echo "G02 server PID: $SERVER_PID"

          # Wait for server to be ready
          READY=0
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/meta 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "G02 server ready after ${i} attempts"
              READY=1
              break
            fi
            echo "Waiting... (attempt $i, HTTP $HTTP_CODE)"
            sleep 2
          done

          if [ "$READY" = "0" ]; then
            echo "ERROR: G02 server did not start within 120 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Run ONLY the G02 State Observatory HTTP E2E suite (19 tests).
          # RUN_E2E_HTTP_TESTS=1 enables the tests (matches the condition
          # at the top of the test file).
          # No SKIP_E2E_SERVER — the test probes the running server
          # via /api/v1/meta and uses BASE_URL = http://localhost:3001
          # (same convention as g01 + g03-06).
          DATABASE_URL="postgresql://balance_app:balance_app_dev_only@localhost:5432/balance?schema=public" \
          DIRECT_URL="postgresql://balance_admin:balance_admin_dev_only@localhost:5432/balance?schema=public" \
          AUTH_DATABASE_URL="postgresql://balance_auth:balance_auth_dev_only@localhost:5432/balance?schema=public" \
          PRIVILEGED_DATABASE_URL="postgresql://balance_snapshot_approver:balance_snapshot_approver_dev_only@localhost:5432/balance?schema=public" \
          AUTH_SECRET="ci_only_secret_not_for_production_min_16_chars" \
          AUTH_TRUST_HOST="true" \
          LLM_PROVIDER="stub" \
          RUN_E2E_HTTP_TESTS=1 \
          bunx vitest run tests/e2e/g02-state-observatory-http.e2e.test.ts --reporter=verbose
          E2E_EXIT=$?

          # Kill server
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          exit $E2E_EXIT
